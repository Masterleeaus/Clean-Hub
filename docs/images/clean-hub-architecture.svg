<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Clean-Hub governed business action path</title><desc id="desc">Source-backed Clean-Hub flow from TitanZeroOrchestrator through ToolRouter, WorkCoreActionController, and BusinessActionDispatcher, with permission, confirmation, idempotency, and audit controls at the business-action boundary.</desc>
