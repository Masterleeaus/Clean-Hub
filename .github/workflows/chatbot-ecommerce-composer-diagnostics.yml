name: ChatbotEcommerce Composer Diagnostics

on:
  push:
    branches:
      - feature/chatbot-ecommerce-v4.9-host-rc
    paths:
      - .github/workflows/chatbot-ecommerce-composer-diagnostics.yml
      - composer.json
      - composer.lock
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chatbot-ecommerce-composer-diagnostics.yml
      - composer.json
      - composer.lock
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: testing
  APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  TITAN_ZERO_WORKCORE_ENABLED: "true"
  TITAN_ZERO_CHATBOT_ENABLED: "true"
  TITAN_ZERO_EXTENSION_DISCOVERY_ENABLED: "true"
  TITAN_ZERO_EXTENSIONS_ENABLED: chatbot-ecommerce

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, fileinfo, gd, intl, json, mbstring, openssl, pdo, pdo_mysql, sodium, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - name: Capture host preparation diagnostics
        id: composer
        shell: bash
        run: |
          set +e
          cp .env.example .env
          mkdir -p storage/framework/{cache/data,sessions,testing,views} storage/logs bootstrap/cache
          {
            echo '## composer validate before update'
            composer validate --no-check-publish --no-interaction
            echo
            echo '## composer update phpoffice/phpspreadsheet'
            composer update phpoffice/phpspreadsheet --with-all-dependencies --no-interaction --no-progress --no-scripts -vvv
            echo
            echo '## composer validate after update'
            composer validate --no-check-publish --no-interaction
            echo
            echo '## composer install with scripts'
            composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader -vvv
            echo
            echo '## artisan package discover'
            php artisan package:discover --ansi -vvv
          } 2>&1 | tee composer-diagnostics.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: chatbot-ecommerce-composer-diagnostics
          path: composer-diagnostics.log
          if-no-files-found: error
      - name: Fail after artifact upload
        if: steps.composer.outputs.status != '0'
        run: exit 1
