name: Laravel CI

on:
  pull_request:
  push:
    branches:
      - agent/v070-upgrade-base

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  validate-composer:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: composer validate --strict

  architecture-tools:
    name: Titan architecture tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      # These are standalone scripts (no vendor/autoload dependency) that check
      # for donor-code leakage, unresolved App\ namespaces, dangling route/provider
      # references and migration create-before-reference ordering.
      - run: php tools/titan_verify.php
      - run: php tools/titan_namespace_scan.php
      - run: php tools/titan_route_provider_scan.php
      - run: php tools/titan_migration_order.php

  install-and-test:
    name: Install, lint, boot, test
    runs-on: ubuntu-latest
    needs: validate-composer
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath, gd, zip, fileinfo, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Code style (Pint)
        # Pint is an enforced CI gate; formatting debt must be fixed before merge.
        run: vendor/bin/pint --test

      - name: Unit, Feature and Architecture tests
        run: php artisan test tests/Unit tests/Feature tests/Architecture --colors=always

      - name: Boot smoke test
        run: |
          php artisan config:cache
          php artisan route:list --ansi

  migration-validation:
    name: Migration validation (SQLite)
    runs-on: ubuntu-latest
    needs: validate-composer
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath, gd, zip, fileinfo, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Fresh migrate
        run: php artisan migrate --force --ansi

      - name: Rollback
        run: php artisan migrate:rollback --force --ansi

      - name: Re-migrate
        run: php artisan migrate --force --ansi

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
