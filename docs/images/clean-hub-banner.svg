<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Clean-Hub Laravel AI business workspace</title><desc id="desc">A teal and amber banner for Clean-Hub, a Laravel AI business workspace organized around Titan orchestration and WorkCore-governed business actions with explicit audit boundaries.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#102d35"/><stop offset="1" stop-color="#173d42"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs><rect width="1200" height="320" rx="24" fill="url(#bg)"/><circle cx="1060" cy="36" r="230" fill="#2dd4bf" opacity=".10"/><path d="M0 280C220 180 430 324 690 232s340-15 510-105" fill="none" stroke="#2dd4bf" stroke-opacity=".2" stroke-width="2"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="64" y="62" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="3">CLEAN-HUB � LARAVEL AI BUSINESS WORKSPACE � TITAN + WORKCORE</text><text x="64" y="126" fill="#f8fafc" font-size="48" font-weight="800">Clean-Hub</text><text x="64" y="158" fill="#cbd5e1" font-size="16">Governed business actions with explicit permission, confirmation, idempotency, and audit boundaries</text></g><g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><path d="M135 240H1065" stroke="url(#line)" stroke-width="3"/><g fill="#12343a" stroke="#2dd4bf" stroke-width="2"><circle cx="155" cy="240" r="25"/><circle cx="385" cy="240" r="25"/><circle cx="615" cy="240" r="25"/><circle cx="845" cy="240" r="25"/><circle cx="1065" cy="240" r="25"/></g><g fill="#f8fafc" font-size="12" font-weight="700"><text x="155" y="245">ORCHESTRATE</text><text x="385" y="245">ROUTE</text><text x="615" y="245">CONTROL</text><text x="845" y="245">DISPATCH</text><text x="1065" y="245">AUDIT</text></g><g fill="#94a3b8" font-size="11"><text x="155" y="284">Titan layer</text><text x="385" y="284">ToolRouter</text><text x="615" y="284">WorkCore</text><text x="845" y="284">business action</text><text x="1065" y="284">safe boundary</text></g></g></svg>

